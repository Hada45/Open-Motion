name: Align mobile new project button

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/align-home-fab-mobile.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Align Home FAB with mobile content edge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='V3.54 — align mobile Home FAB with workspace content'
          if marker not in s:
              css='''\n/* V3.54 — align mobile Home FAB with workspace content */\n@media(max-width:520px){\n  .simpleHome .fabHome{\n    left:20px!important;\n    right:auto!important;\n  }\n}\n@media(max-width:360px){\n  .simpleHome .fabHome{\n    left:15px!important;\n    right:auto!important;\n  }\n}\n'''
              if '</style>' not in s:
                  raise SystemExit('No </style> tag found')
              s=s.replace('</style>',css+'\n</style>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/align-home-fab-mobile.yml
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Align new project button with mobile content"
          git push origin main
