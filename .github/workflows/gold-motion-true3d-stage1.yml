name: Gold Motion True3D Stage 1

on:
  push:
    branches:
      - prototype/gold-motion-true3d-stage1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: prototypes/gold-motion-true3d-stage1
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: gold-motion-true3d-stage1-apk
          path: prototypes/gold-motion-true3d-stage1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
