name: Patch media relink V3.57

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'trigger-relink-v357b'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch single-file Open Motion
        shell: bash
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import base64
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'oms-relink-v357' not in s:
              patch=base64.b64decode('').decode('utf-8')
              if '</body>' not in s:
                  raise SystemExit('missing </body>')
              p.write_text(s.replace('</body>',patch+'\n</body>',1),encoding='utf-8')
          PYCODE
      - name: Cleanup workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/patch-relink-v357.yml
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Make media relink always accessible"
          git push origin main
