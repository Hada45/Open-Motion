name: Fix True 3D mobile width

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch responsive inspector layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'V3.48 — responsive True 3D / Inspector width containment'
          if marker not in text:
              css = r'''
/* V3.48 — responsive True 3D / Inspector width containment */
.drawerBody.propPanel{
  min-width:0;
  width:100%;
  max-width:100%;
  overflow-y:auto;
  overflow-x:hidden;
}
.drawerBody.propPanel > *{
  min-width:0;
  max-width:100%;
}
.drawerBody.propPanel .true3dCard{
  grid-template-columns:34px minmax(0,1fr);
  min-width:0;
  width:100%;
  max-width:100%;
}
.drawerBody.propPanel .true3dCard > div{
  min-width:0;
  max-width:100%;
}
.drawerBody.propPanel .true3dCard small,
.drawerBody.propPanel .miniNote{
  overflow-wrap:anywhere;
  word-break:break-word;
}
.drawerBody.propPanel .switchRow{
  min-width:0;
  width:100%;
  max-width:100%;
}
.drawerBody.propPanel .switchRow > span{
  min-width:0;
  overflow-wrap:anywhere;
}
.drawerBody.propPanel .propRow{
  grid-template-columns:minmax(0,88px) minmax(0,1fr) minmax(0,34px);
  min-width:0;
  width:100%;
  max-width:100%;
}
.drawerBody.propPanel .propRow > *{
  min-width:0;
  max-width:100%;
}
.drawerBody.propPanel .propRow input,
.drawerBody.propPanel .propRow select{
  box-sizing:border-box;
  min-width:0;
  width:100%;
  max-width:100%;
}
#cameraOrbitTarget{
  min-width:0;
  width:100%;
  max-width:100%;
  text-overflow:ellipsis;
}
@media(max-width:520px){
  .drawerBody.propPanel{
    padding-left:9px;
    padding-right:9px;
  }
  .drawerBody.propPanel .propRow{
    grid-template-columns:minmax(0,76px) minmax(0,1fr) minmax(0,42px);
    gap:6px;
  }
  .drawerBody.propPanel .propRow label{
    min-width:0;
    white-space:normal;
    font-size:9px;
  }
  .drawerBody.propPanel .projectionPill{
    min-width:0;
    justify-self:end;
    white-space:nowrap;
  }
}
'''
              if '</style>' not in text:
                  raise SystemExit('No </style> tag found')
              text = text.replace('</style>', css + '\n</style>', 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Remove temporary workflow and trigger, then commit
        run: |
          rm -f .github/workflows/fix-true3d-mobile-width.yml .true3d-layout-trigger
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Fix True 3D camera panel width on mobile"
          git push origin main
