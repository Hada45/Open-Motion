name: Fix True 3D mobile width

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-true3d-mobile-width.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch responsive inspector layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'V3.48 — responsive True 3D / Inspector width containment'
          if marker not in text:
              css = base64.b64decode('').decode('utf-8')
              if '</style>' not in text:
                  raise SystemExit('No </style> tag found')
              text = text.replace('</style>', css + '\n</style>', 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-time files and commit
        run: |
          rm -f .github/workflows/fix-true3d-mobile-width.yml .true3d-layout-trigger
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Fix True 3D camera panel width on mobile"
          git push origin main
