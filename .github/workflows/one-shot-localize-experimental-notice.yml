name: One-shot localize experimental notice

on:
  push:
    paths:
      - '.github/workflows/one-shot-localize-experimental-notice.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch experimental notice localization
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          block = r'''const EXPERIMENTAL_NOTICE_I18N={
            id:{
              eyebrow:`EXPERIMENTAL PREVIEW`,title:`Open Motion masih dalam tahap eksperimen`,intro:`Versi yang kamu gunakan sekarang masih merupakan prototipe awal. Fiturnya memang belum banyak dan kemungkinan masih ada beberapa bug.`,accept:`Saya Mengerti`,
              body:`<h3>Open Motion saat ini</h3><p>Beberapa bagian seperti <strong>playback, timeline, sistem 3D, performa, dan fitur editor lainnya</strong> masih terus dikembangkan dan disempurnakan.</p><p>Open Motion akan berkembang secara bertahap dengan fokus membangun editor motion graphics yang fleksibel, ringan, dan punya workflow yang nyaman digunakan.</p><h3>Rencana ke depan</h3><p>Untuk sekarang, Open Motion dikembangkan sebagai aplikasi berbasis web karena lebih cepat untuk melakukan eksperimen, mencoba fitur baru, dan mengubah sistem editor.</p><p>Ke depannya, ada rencana untuk membuat <strong>versi aplikasi native, termasuk APK Android</strong>, setelah <strong>Opus Framework</strong> dirilis dan kondisinya sudah cukup matang untuk digunakan.</p><h3>Apa itu Opus Framework?</h3><p><strong>Opus</strong> adalah framework <em>video timeline composition</em> berbasis <strong>Kotlin Multiplatform</strong> yang sedang dikembangkan oleh The Prismatic Company, yang juga melibatkan pengembang yang sebelumnya pernah mengerjakan Alight Motion.</p><p>Secara sederhana, Opus menyediakan fondasi untuk membuat aplikasi yang berhubungan dengan video dan motion graphics. Framework ini dirancang untuk menangani video, audio, gambar, teks, compositing, animasi, efek visual, timeline multimedia, preview, rendering, export, serta berbagai kebutuhan media lainnya.</p><p>Cara kerjanya memakai pendekatan yang mirip dengan <strong>Jetpack Compose / Compose Multiplatform</strong>, sehingga timeline dan elemen media dapat bereaksi terhadap perubahan state secara real-time saat pengguna melakukan editing.</p><p>Opus juga sudah memperlihatkan dukungan untuk <strong>ruang 3D</strong> seperti posisi X, Y, Z, kamera, parallax, dan rotasi tiga dimensi, serta API tingkat rendah untuk <strong>GPU rendering dan custom shader GLSL</strong>.</p><h3>Kenapa Open Motion tertarik memakai Opus?</h3><p>Karena tujuan Open Motion bukan hanya menjadi editor video biasa. Open Motion direncanakan berkembang menjadi editor <strong>motion graphics, animation, compositing, dan 3D</strong>.</p><div class="experimentalNoticeCallout"><strong>Opus bisa menjadi fondasi mesin multimedia Open Motion</strong> untuk menangani timeline, decoding video/audio, playback, compositing, animasi, efek, filter, GPU rendering, export video, serta sistem 3D dan kamera.</div><p>Kalau Opus nantinya memang cocok, Open Motion tidak perlu membangun seluruh engine multimedia dari nol. Pengembangan bisa lebih fokus pada bagian yang benar-benar membentuk identitas Open Motion: <strong>UI editor, keyframe, timeline, workflow animasi, tools, efek, dan fitur kreatif lainnya.</strong></p><p>Opus berbasis Kotlin Multiplatform dan dirancang untuk digunakan di beberapa platform. Pada materi pengembangnya, iPhone, iPad, dan macOS sudah didukung, sementara Android dan Windows masih dalam pengembangan. Dukungan Web dan backend juga direncanakan.</p><p>Opus juga direncanakan menjadi <strong>open source</strong>, tetapi saat ini masih dipersiapkan sebelum dirilis secara publik.</p><h3>Belum keputusan final</h3><p><strong>Opus belum tentu menjadi engine final Open Motion.</strong> Setelah framework-nya benar-benar dirilis, baru bisa dilihat apakah performa, fitur, kompatibilitas, lisensi, dan arah pengembangannya cocok dengan kebutuhan Open Motion.</p><p>Untuk sekarang, Open Motion akan tetap berkembang sebagai proyek eksperimen sambil terus membangun fitur dan mencoba berbagai ide.</p><p><strong>Terima kasih sudah mencoba Open Motion dan ikut melihat perkembangannya dari tahap awal.</strong></p>`
            },
            en:{
              eyebrow:`EXPERIMENTAL PREVIEW`,title:`Open Motion is still experimental`,intro:`The version you are using is still an early prototype. Features are still limited, and some bugs may remain.`,accept:`I Understand`,
              body:`<h3>Open Motion today</h3><p>Several areas, including <strong>playback, the timeline, the 3D system, performance, and other editor features</strong>, are still being developed and refined.</p><p>Open Motion will continue to evolve step by step, with a focus on building a flexible, lightweight motion graphics editor with a comfortable workflow.</p><h3>Future plans</h3><p>For now, Open Motion is developed as a web-based application because it makes experimentation, feature testing, and editor changes faster.</p><p>In the future, there are plans for a <strong>native application, including an Android APK</strong>, after <strong>Opus Framework</strong> is released and mature enough to use.</p><h3>What is Opus Framework?</h3><p><strong>Opus</strong> is a <em>video timeline composition</em> framework based on <strong>Kotlin Multiplatform</strong>, currently being developed by The Prismatic Company, which also involves developers who previously worked on Alight Motion.</p><p>In simple terms, Opus provides a foundation for building video and motion graphics applications. It is designed to handle video, audio, images, text, compositing, animation, visual effects, multimedia timelines, preview, rendering, export, and other media needs.</p><p>Its approach is similar to <strong>Jetpack Compose / Compose Multiplatform</strong>, allowing timelines and media elements to react to state changes in real time while editing.</p><p>Opus has also demonstrated support for <strong>3D space</strong>, including X, Y, Z positioning, cameras, parallax, three-dimensional rotation, and low-level APIs for <strong>GPU rendering and custom GLSL shaders</strong>.</p><h3>Why is Open Motion interested in Opus?</h3><p>Because Open Motion is not intended to be just a basic video editor. It is planned to grow into a <strong>motion graphics, animation, compositing, and 3D</strong> editor.</p><div class="experimentalNoticeCallout"><strong>Opus could become the multimedia engine foundation for Open Motion</strong>, handling timelines, video/audio decoding, playback, compositing, animation, effects, filters, GPU rendering, video export, and 3D and camera systems.</div><p>If Opus proves to be a good fit, Open Motion would not need to build the entire multimedia engine from scratch. Development could focus more on what defines Open Motion: <strong>the editor UI, keyframes, timeline, animation workflow, tools, effects, and other creative features.</strong></p><p>Opus is based on Kotlin Multiplatform and is designed for multiple platforms. In its developer material, iPhone, iPad, and macOS are already supported, while Android and Windows are still in development. Web and backend support are also planned.</p><p>Opus is also planned to become <strong>open source</strong>, but it is still being prepared before its public release.</p><h3>Not a final decision</h3><p><strong>Opus is not guaranteed to become Open Motion's final engine.</strong> Once the framework is publicly released, its performance, features, compatibility, licensing, and development direction can be evaluated against Open Motion's needs.</p><p>For now, Open Motion will continue to grow as an experimental project while new features and ideas are explored.</p><p><strong>Thank you for trying Open Motion and following its development from this early stage.</strong></p>`
            },
            zh:{
              eyebrow:`实验预览`,title:`Open Motion 仍处于实验阶段`,intro:`你现在使用的版本仍是早期原型。功能还比较有限，也可能存在一些错误。`,accept:`我明白了`,
              body:`<h3>当前的 Open Motion</h3><p>包括<strong>播放、时间线、3D 系统、性能以及其他编辑器功能</strong>在内的多个部分仍在持续开发和完善。</p><p>Open Motion 将逐步发展，目标是打造一个灵活、轻量，并拥有舒适工作流程的动态图形编辑器。</p><h3>未来计划</h3><p>目前 Open Motion 以 Web 应用形式开发，因为这样更便于快速实验、测试新功能以及调整编辑器系统。</p><p>未来计划在 <strong>Opus Framework</strong> 正式发布并足够成熟后，开发<strong>原生应用版本，包括 Android APK</strong>。</p><h3>什么是 Opus Framework？</h3><p><strong>Opus</strong> 是一个基于 <strong>Kotlin Multiplatform</strong> 的<em>视频时间线合成</em>框架，由 The Prismatic Company 开发，其中也有曾参与 Alight Motion 开发的人员。</p><p>简单来说，Opus 为视频和动态图形应用提供底层基础，可用于处理视频、音频、图像、文本、合成、动画、视觉效果、多媒体时间线、预览、渲染、导出等媒体需求。</p><p>它采用类似 <strong>Jetpack Compose / Compose Multiplatform</strong> 的方式，使时间线和媒体元素能够在编辑时实时响应状态变化。</p><p>Opus 还展示了对<strong>3D 空间</strong>的支持，包括 X、Y、Z 坐标、相机、视差、三维旋转，以及用于<strong>GPU 渲染和自定义 GLSL 着色器</strong>的底层 API。</p><h3>为什么 Open Motion 对 Opus 感兴趣？</h3><p>因为 Open Motion 的目标并不只是成为普通的视频编辑器，而是逐步发展为<strong>动态图形、动画、合成和 3D</strong> 编辑器。</p><div class="experimentalNoticeCallout"><strong>Opus 可能成为 Open Motion 多媒体引擎的基础</strong>，负责时间线、视频/音频解码、播放、合成、动画、效果、滤镜、GPU 渲染、视频导出以及 3D 和相机系统。</div><p>如果 Opus 最终适合 Open Motion，就无需从零构建完整的多媒体引擎，开发可以更专注于真正形成 Open Motion 特色的部分：<strong>编辑器 UI、关键帧、时间线、动画工作流、工具、效果和其他创意功能。</strong></p><p>Opus 基于 Kotlin Multiplatform，面向多平台设计。根据开发者资料，iPhone、iPad 和 macOS 已受到支持，Android 与 Windows 仍在开发中，Web 和后端支持也在规划中。</p><p>Opus 也计划成为<strong>开源</strong>项目，但目前仍在为公开发布做准备。</p><h3>尚未最终决定</h3><p><strong>Opus 不一定会成为 Open Motion 最终采用的引擎。</strong>等框架真正公开发布后，还需要根据性能、功能、兼容性、许可证以及开发方向来判断是否符合 Open Motion 的需求。</p><p>目前 Open Motion 会继续作为实验项目发展，同时不断构建功能并尝试新的想法。</p><p><strong>感谢你从早期阶段开始尝试并关注 Open Motion 的发展。</strong></p>`
            },
            ja:{
              eyebrow:`実験プレビュー`,title:`Open Motion はまだ実験段階です`,intro:`現在使用しているバージョンは、まだ初期プロトタイプです。機能は限られており、いくつかの不具合が残っている可能性があります。`,accept:`理解しました`,
              body:`<h3>現在の Open Motion</h3><p><strong>再生、タイムライン、3D システム、パフォーマンス、その他のエディター機能</strong>は、現在も開発と改善が続いています。</p><p>Open Motion は、柔軟で軽量、そして使いやすいワークフローを持つモーショングラフィックスエディターを目指して段階的に進化していきます。</p><h3>今後の計画</h3><p>現在は、実験や新機能の検証、エディターの変更を素早く行えるため、Web アプリとして開発しています。</p><p>将来的には、<strong>Opus Framework</strong> が公開され、十分に成熟した段階で、<strong>Android APK を含むネイティブアプリ版</strong>を作る計画があります。</p><h3>Opus Framework とは？</h3><p><strong>Opus</strong> は、The Prismatic Company が開発中の <strong>Kotlin Multiplatform</strong> ベースの<em>ビデオタイムラインコンポジション</em>フレームワークです。同社には、以前 Alight Motion の開発に携わった開発者も参加しています。</p><p>簡単に言えば、Opus は動画やモーショングラフィックスアプリを作るための基盤で、動画、音声、画像、テキスト、コンポジット、アニメーション、視覚効果、マルチメディアタイムライン、プレビュー、レンダリング、書き出しなどを扱うことを目的としています。</p><p><strong>Jetpack Compose / Compose Multiplatform</strong> に近い考え方を採用しており、編集時の state 変更に対してタイムラインやメディア要素をリアルタイムに反応させられます。</p><p>さらに、X・Y・Z 座標、カメラ、パララックス、3 次元回転などの<strong>3D 空間</strong>と、<strong>GPU レンダリングやカスタム GLSL シェーダー</strong>向けの低レベル API も示されています。</p><h3>なぜ Open Motion は Opus に注目しているのか？</h3><p>Open Motion は単なる動画編集アプリではなく、将来的に<strong>モーショングラフィックス、アニメーション、コンポジット、3D</strong>まで扱えるエディターを目指しているからです。</p><div class="experimentalNoticeCallout"><strong>Opus は Open Motion のマルチメディアエンジンの土台になる可能性があります。</strong>タイムライン、動画・音声デコード、再生、コンポジット、アニメーション、エフェクト、フィルター、GPU レンダリング、動画書き出し、3D とカメラシステムなどを担えます。</div><p>Opus が適していれば、Open Motion はマルチメディアエンジン全体をゼロから作る必要がなくなり、<strong>エディター UI、キーフレーム、タイムライン、アニメーションワークフロー、ツール、エフェクトなどの創造的な機能</strong>により集中できます。</p><p>Opus は Kotlin Multiplatform ベースで、複数プラットフォームを想定しています。開発資料では iPhone、iPad、macOS が対応済みで、Android と Windows は開発中、Web とバックエンドも計画されています。</p><p>Opus は<strong>オープンソース</strong>化も予定されていますが、現在は一般公開に向けた準備段階です。</p><h3>まだ最終決定ではありません</h3><p><strong>Opus が Open Motion の最終エンジンになるとは限りません。</strong>実際に公開された後で、性能、機能、互換性、ライセンス、開発方針が Open Motion の要件に合うかを判断します。</p><p>それまでは Open Motion を実験的なプロジェクトとして継続し、機能の追加や新しいアイデアの検証を進めます。</p><p><strong>Open Motion を試し、初期段階からその成長を見てくれてありがとうございます。</strong></p>`
            },
            ms:{
              eyebrow:`PRATONTON EKSPERIMEN`,title:`Open Motion masih dalam peringkat eksperimen`,intro:`Versi yang anda gunakan sekarang masih merupakan prototaip awal. Ciri masih terhad dan beberapa pepijat mungkin masih wujud.`,accept:`Saya Faham`,
              body:`<h3>Open Motion sekarang</h3><p>Beberapa bahagian seperti <strong>playback, timeline, sistem 3D, prestasi dan ciri editor lain</strong> masih sedang dibangunkan dan diperhalusi.</p><p>Open Motion akan berkembang secara berperingkat dengan fokus membina editor motion graphics yang fleksibel, ringan dan mempunyai aliran kerja yang selesa.</p><h3>Rancangan akan datang</h3><p>Buat masa ini, Open Motion dibangunkan sebagai aplikasi berasaskan web kerana lebih cepat untuk bereksperimen, menguji ciri baharu dan mengubah sistem editor.</p><p>Pada masa hadapan, terdapat rancangan untuk menghasilkan <strong>aplikasi native, termasuk APK Android</strong>, selepas <strong>Opus Framework</strong> dilancarkan dan cukup matang untuk digunakan.</p><h3>Apakah Opus Framework?</h3><p><strong>Opus</strong> ialah framework <em>video timeline composition</em> berasaskan <strong>Kotlin Multiplatform</strong> yang sedang dibangunkan oleh The Prismatic Company, yang turut melibatkan pembangun yang pernah mengerjakan Alight Motion.</p><p>Secara ringkas, Opus menyediakan asas untuk membina aplikasi video dan motion graphics. Ia direka untuk mengendalikan video, audio, imej, teks, compositing, animasi, kesan visual, timeline multimedia, preview, rendering, export dan keperluan media lain.</p><p>Pendekatannya mirip <strong>Jetpack Compose / Compose Multiplatform</strong>, supaya timeline dan elemen media boleh bertindak balas terhadap perubahan state secara masa nyata semasa penyuntingan.</p><p>Opus juga telah menunjukkan sokongan untuk <strong>ruang 3D</strong> termasuk posisi X, Y, Z, kamera, parallax, putaran tiga dimensi serta API aras rendah untuk <strong>GPU rendering dan custom shader GLSL</strong>.</p><h3>Mengapa Open Motion berminat menggunakan Opus?</h3><p>Kerana Open Motion bukan dirancang sekadar sebagai editor video biasa. Ia dirancang berkembang menjadi editor <strong>motion graphics, animation, compositing dan 3D</strong>.</p><div class="experimentalNoticeCallout"><strong>Opus berpotensi menjadi asas enjin multimedia Open Motion</strong> untuk timeline, decoding video/audio, playback, compositing, animasi, kesan, penapis, GPU rendering, export video serta sistem 3D dan kamera.</div><p>Jika Opus benar-benar sesuai, Open Motion tidak perlu membina keseluruhan enjin multimedia dari kosong. Pembangunan boleh lebih tertumpu pada identiti Open Motion: <strong>UI editor, keyframe, timeline, workflow animasi, tools, efek dan ciri kreatif lain.</strong></p><p>Opus berasaskan Kotlin Multiplatform dan direka untuk beberapa platform. Dalam bahan pembangunnya, iPhone, iPad dan macOS sudah disokong, manakala Android dan Windows masih dibangunkan. Sokongan Web dan backend juga dirancang.</p><p>Opus juga dirancang menjadi <strong>open source</strong>, tetapi masih dipersiapkan sebelum pelancaran awam.</p><h3>Belum keputusan muktamad</h3><p><strong>Opus belum tentu menjadi enjin akhir Open Motion.</strong> Selepas framework itu benar-benar dilancarkan, prestasi, ciri, keserasian, lesen dan hala tuju pembangunannya akan dinilai mengikut keperluan Open Motion.</p><p>Buat masa ini, Open Motion akan terus berkembang sebagai projek eksperimen sambil membina ciri dan mencuba pelbagai idea.</p><p><strong>Terima kasih kerana mencuba Open Motion dan mengikuti perkembangannya sejak peringkat awal.</strong></p>`
            },
            th:{
              eyebrow:`ตัวอย่างทดลอง`,title:`Open Motion ยังอยู่ในขั้นทดลอง`,intro:`เวอร์ชันที่คุณใช้อยู่ยังเป็นต้นแบบระยะแรก ฟีเจอร์ยังมีไม่มากและอาจยังพบข้อผิดพลาดบางอย่าง`,accept:`เข้าใจแล้ว`,
              body:`<h3>Open Motion ในตอนนี้</h3><p>หลายส่วน เช่น <strong>การเล่นวิดีโอ ไทม์ไลน์ ระบบ 3D ประสิทธิภาพ และฟีเจอร์อื่นของตัวแก้ไข</strong> ยังอยู่ระหว่างการพัฒนาและปรับปรุง</p><p>Open Motion จะค่อย ๆ พัฒนาต่อไป โดยมุ่งสร้างโปรแกรม motion graphics ที่ยืดหยุ่น เบา และมี workflow ที่ใช้งานสะดวก</p><h3>แผนในอนาคต</h3><p>ตอนนี้ Open Motion พัฒนาเป็นแอปบนเว็บ เพราะช่วยให้ทดลอง ทดสอบฟีเจอร์ใหม่ และปรับระบบตัวแก้ไขได้รวดเร็วกว่า</p><p>ในอนาคตมีแผนสร้าง<strong>แอป native รวมถึง APK สำหรับ Android</strong> หลังจาก <strong>Opus Framework</strong> เปิดตัวและมีความพร้อมเพียงพอ</p><h3>Opus Framework คืออะไร?</h3><p><strong>Opus</strong> คือ framework สำหรับ <em>video timeline composition</em> ที่สร้างบน <strong>Kotlin Multiplatform</strong> และกำลังพัฒนาโดย The Prismatic Company ซึ่งมีนักพัฒนาที่เคยทำงานกับ Alight Motion ร่วมอยู่ด้วย</p><p>พูดง่าย ๆ คือ Opus เป็นรากฐานสำหรับสร้างแอปวิดีโอและ motion graphics โดยออกแบบมาเพื่อจัดการวิดีโอ เสียง รูปภาพ ข้อความ compositing แอนิเมชัน visual effects ไทม์ไลน์มัลติมีเดีย preview rendering export และงานสื่ออื่น ๆ</p><p>แนวทางการทำงานคล้าย <strong>Jetpack Compose / Compose Multiplatform</strong> ทำให้ไทม์ไลน์และองค์ประกอบสื่อสามารถตอบสนองต่อการเปลี่ยน state แบบเรียลไทม์ระหว่างการแก้ไข</p><p>Opus ยังแสดงการรองรับ<strong>พื้นที่ 3D</strong> เช่น ตำแหน่ง X, Y, Z กล้อง parallax การหมุนสามมิติ รวมถึง API ระดับต่ำสำหรับ<strong>GPU rendering และ custom shader GLSL</strong></p><h3>ทำไม Open Motion ถึงสนใจ Opus?</h3><p>เพราะเป้าหมายของ Open Motion ไม่ใช่แค่โปรแกรมตัดต่อวิดีโอทั่วไป แต่จะพัฒนาไปเป็น editor สำหรับ <strong>motion graphics, animation, compositing และ 3D</strong></p><div class="experimentalNoticeCallout"><strong>Opus อาจเป็นรากฐานของ multimedia engine สำหรับ Open Motion</strong> เพื่อจัดการไทม์ไลน์ การถอดรหัสวิดีโอ/เสียง playback compositing แอนิเมชัน เอฟเฟกต์ ฟิลเตอร์ GPU rendering export วิดีโอ รวมถึงระบบ 3D และกล้อง</div><p>หาก Opus เหมาะสม Open Motion ก็ไม่จำเป็นต้องสร้าง multimedia engine ทั้งหมดจากศูนย์ และสามารถมุ่งพัฒนาส่วนที่เป็นเอกลักษณ์ของ Open Motion ได้มากขึ้น เช่น <strong>UI editor, keyframe, timeline, workflow แอนิเมชัน, tools, effects และฟีเจอร์สร้างสรรค์อื่น ๆ</strong></p><p>Opus ใช้ Kotlin Multiplatform และออกแบบให้รองรับหลายแพลตฟอร์ม ตามข้อมูลจากผู้พัฒนา iPhone, iPad และ macOS รองรับแล้ว ส่วน Android และ Windows ยังอยู่ระหว่างพัฒนา และมีแผนรองรับ Web กับ backend ด้วย</p><p>Opus มีแผนจะเป็น <strong>open source</strong> แต่ตอนนี้ยังอยู่ระหว่างเตรียมความพร้อมก่อนเผยแพร่สู่สาธารณะ</p><h3>ยังไม่ใช่การตัดสินใจสุดท้าย</h3><p><strong>ยังไม่มีการรับประกันว่า Opus จะเป็น engine สุดท้ายของ Open Motion</strong> หลัง framework เปิดตัวจริงแล้ว จึงจะสามารถประเมินประสิทธิภาพ ฟีเจอร์ ความเข้ากันได้ ไลเซนส์ และทิศทางการพัฒนาได้</p><p>ในตอนนี้ Open Motion จะยังคงพัฒนาในฐานะโครงการทดลอง พร้อมสร้างฟีเจอร์และลองแนวคิดใหม่ ๆ ต่อไป</p><p><strong>ขอบคุณที่ทดลองใช้ Open Motion และติดตามการพัฒนาตั้งแต่ช่วงเริ่มต้น</strong></p>`
            },
            vi:{
              eyebrow:`BẢN XEM THỬ NGHIỆM`,title:`Open Motion vẫn đang ở giai đoạn thử nghiệm`,intro:`Phiên bản bạn đang sử dụng vẫn là nguyên mẫu ban đầu. Tính năng còn hạn chế và một số lỗi có thể vẫn tồn tại.`,accept:`Tôi hiểu`,
              body:`<h3>Open Motion hiện tại</h3><p>Một số phần như <strong>playback, timeline, hệ thống 3D, hiệu năng và các tính năng khác của trình chỉnh sửa</strong> vẫn đang được phát triển và hoàn thiện.</p><p>Open Motion sẽ tiếp tục phát triển từng bước, tập trung xây dựng một trình chỉnh sửa motion graphics linh hoạt, nhẹ và có workflow thuận tiện.</p><h3>Kế hoạch tương lai</h3><p>Hiện tại Open Motion được phát triển dưới dạng ứng dụng web vì cách này giúp thử nghiệm, kiểm tra tính năng mới và thay đổi hệ thống chỉnh sửa nhanh hơn.</p><p>Trong tương lai có kế hoạch tạo <strong>ứng dụng native, bao gồm APK Android</strong>, sau khi <strong>Opus Framework</strong> được phát hành và đủ trưởng thành để sử dụng.</p><h3>Opus Framework là gì?</h3><p><strong>Opus</strong> là framework <em>video timeline composition</em> dựa trên <strong>Kotlin Multiplatform</strong>, đang được The Prismatic Company phát triển, với sự tham gia của những nhà phát triển từng làm việc trên Alight Motion.</p><p>Nói đơn giản, Opus cung cấp nền tảng để xây dựng ứng dụng video và motion graphics. Framework này được thiết kế để xử lý video, audio, hình ảnh, văn bản, compositing, animation, visual effects, timeline đa phương tiện, preview, rendering, export và nhiều nhu cầu media khác.</p><p>Cách tiếp cận của Opus tương tự <strong>Jetpack Compose / Compose Multiplatform</strong>, giúp timeline và các phần tử media phản ứng theo thay đổi state theo thời gian thực trong lúc chỉnh sửa.</p><p>Opus cũng đã cho thấy khả năng hỗ trợ <strong>không gian 3D</strong> như vị trí X, Y, Z, camera, parallax, xoay ba chiều, cùng API cấp thấp cho <strong>GPU rendering và custom shader GLSL</strong>.</p><h3>Tại sao Open Motion quan tâm đến Opus?</h3><p>Vì Open Motion không chỉ hướng đến một trình chỉnh sửa video thông thường. Dự án được định hướng phát triển thành editor cho <strong>motion graphics, animation, compositing và 3D</strong>.</p><div class="experimentalNoticeCallout"><strong>Opus có thể trở thành nền tảng multimedia engine của Open Motion</strong>, xử lý timeline, giải mã video/audio, playback, compositing, animation, hiệu ứng, bộ lọc, GPU rendering, export video, cùng hệ thống 3D và camera.</div><p>Nếu Opus thực sự phù hợp, Open Motion sẽ không phải xây toàn bộ multimedia engine từ đầu. Việc phát triển có thể tập trung hơn vào những phần tạo nên bản sắc của Open Motion: <strong>UI editor, keyframe, timeline, workflow animation, tools, effects và các tính năng sáng tạo khác.</strong></p><p>Opus dựa trên Kotlin Multiplatform và được thiết kế cho nhiều nền tảng. Theo tài liệu của nhà phát triển, iPhone, iPad và macOS đã được hỗ trợ, trong khi Android và Windows vẫn đang được phát triển. Web và backend cũng nằm trong kế hoạch.</p><p>Opus cũng được lên kế hoạch trở thành <strong>open source</strong>, nhưng hiện vẫn đang được chuẩn bị trước khi phát hành công khai.</p><h3>Chưa phải quyết định cuối cùng</h3><p><strong>Opus chưa chắc sẽ trở thành engine cuối cùng của Open Motion.</strong> Sau khi framework thực sự được phát hành, hiệu năng, tính năng, khả năng tương thích, giấy phép và hướng phát triển mới có thể được đánh giá theo nhu cầu của Open Motion.</p><p>Hiện tại, Open Motion sẽ tiếp tục phát triển như một dự án thử nghiệm, vừa xây dựng tính năng vừa thử các ý tưởng mới.</p><p><strong>Cảm ơn bạn đã thử Open Motion và theo dõi sự phát triển của dự án từ giai đoạn đầu.</strong></p>`
            },
            fil:{
              eyebrow:`EKSPERIMENTAL NA PREVIEW`,title:`Eksperimental pa rin ang Open Motion`,intro:`Ang bersyong ginagamit mo ngayon ay maagang prototype pa lamang. Limitado pa ang mga feature at maaaring may ilang bug pa.`,accept:`Nauunawaan Ko`,
              body:`<h3>Open Motion sa ngayon</h3><p>Patuloy pang ginagawa at pinapahusay ang ilang bahagi gaya ng <strong>playback, timeline, 3D system, performance, at iba pang feature ng editor</strong>.</p><p>Unti-unting palalawakin ang Open Motion na may pokus sa isang flexible, magaan, at komportableng motion graphics workflow.</p><h3>Mga plano sa hinaharap</h3><p>Sa ngayon, web-based application muna ang Open Motion dahil mas mabilis dito ang pag-eeksperimento, pagsubok ng bagong feature, at pagbabago sa editor system.</p><p>Sa hinaharap, may planong gumawa ng <strong>native application, kabilang ang Android APK</strong>, kapag nailabas na ang <strong>Opus Framework</strong> at sapat na itong mature para gamitin.</p><h3>Ano ang Opus Framework?</h3><p>Ang <strong>Opus</strong> ay isang <em>video timeline composition</em> framework na nakabatay sa <strong>Kotlin Multiplatform</strong> at kasalukuyang ginagawa ng The Prismatic Company, na kinabibilangan din ng mga developer na dating nagtrabaho sa Alight Motion.</p><p>Sa madaling salita, nagbibigay ang Opus ng pundasyon para sa paggawa ng video at motion graphics applications. Dinisenyo itong humawak ng video, audio, image, text, compositing, animation, visual effects, multimedia timeline, preview, rendering, export, at iba pang pangangailangan sa media.</p><p>May approach itong kahawig ng <strong>Jetpack Compose / Compose Multiplatform</strong>, kaya maaaring tumugon nang real-time ang timeline at media elements sa pagbabago ng state habang nag-e-edit.</p><p>Nagpakita rin ang Opus ng suporta para sa <strong>3D space</strong>, kabilang ang X, Y, Z position, camera, parallax, three-dimensional rotation, at low-level API para sa <strong>GPU rendering at custom GLSL shaders</strong>.</p><h3>Bakit interesado ang Open Motion sa Opus?</h3><p>Dahil hindi lamang simpleng video editor ang layunin ng Open Motion. Plano itong maging editor para sa <strong>motion graphics, animation, compositing, at 3D</strong>.</p><div class="experimentalNoticeCallout"><strong>Maaaring maging pundasyon ng multimedia engine ng Open Motion ang Opus</strong> para sa timeline, video/audio decoding, playback, compositing, animation, effects, filters, GPU rendering, video export, at 3D at camera systems.</div><p>Kung magiging angkop ang Opus, hindi na kailangang buuin ng Open Motion ang buong multimedia engine mula sa simula. Mas makakapokus ang development sa identidad ng Open Motion: <strong>editor UI, keyframes, timeline, animation workflow, tools, effects, at iba pang creative feature.</strong></p><p>Nakabatay ang Opus sa Kotlin Multiplatform at dinisenyo para sa iba't ibang platform. Sa developer materials nito, supported na ang iPhone, iPad, at macOS, habang ginagawa pa ang Android at Windows. Nakaplano rin ang Web at backend support.</p><p>Nakaplano ring gawing <strong>open source</strong> ang Opus, ngunit kasalukuyan pa itong inihahanda bago ang public release.</p><h3>Hindi pa pinal na desisyon</h3><p><strong>Hindi garantisadong Opus ang magiging final engine ng Open Motion.</strong> Kapag nailabas na talaga ang framework, saka masusuri kung ang performance, features, compatibility, license, at direksyon ng development nito ay akma sa Open Motion.</p><p>Sa ngayon, patuloy na lalago ang Open Motion bilang experimental project habang gumagawa ng mga feature at sumusubok ng mga bagong ideya.</p><p><strong>Salamat sa pagsubok ng Open Motion at sa pagsubaybay sa pag-unlad nito mula sa maagang yugto.</strong></p>`
            },
            my:{
              eyebrow:`စမ်းသပ် အကြိုကြည့်ရှုမှု`,title:`Open Motion သည် စမ်းသပ်အဆင့်တွင် ရှိနေဆဲဖြစ်သည်`,intro:`ယခုအသုံးပြုနေသော ဗားရှင်းသည် အစောပိုင်း prototype တစ်ခုသာ ဖြစ်သေးသည်။ လုပ်ဆောင်ချက်များ များစွာမရှိသေးသလို bug အချို့လည်း ရှိနိုင်သည်။`,accept:`နားလည်ပါပြီ`,
              body:`<h3>လက်ရှိ Open Motion</h3><p><strong>playback, timeline, 3D system, performance နှင့် editor feature အခြားများ</strong>ကို ဆက်လက်ဖွံ့ဖြိုးပြီး ပြင်ဆင်နေဆဲဖြစ်သည်။</p><p>Open Motion ကို ပေါ့ပါးပြီး ပြောင်းလွယ်ပြင်လွယ်ရှိကာ အသုံးပြုရ အဆင်ပြေသော motion graphics editor တစ်ခုဖြစ်လာစေရန် တဖြည်းဖြည်း ဖွံ့ဖြိုးသွားမည်ဖြစ်သည်။</p><h3>အနာဂတ်အစီအစဉ်</h3><p>လက်ရှိတွင် စမ်းသပ်မှုများ၊ feature အသစ်များ စမ်းသပ်ခြင်းနှင့် editor system ပြောင်းလဲမှုများကို ပိုမြန်စေရန် Open Motion ကို web-based application အဖြစ် ဖွံ့ဖြိုးထားသည်။</p><p>အနာဂတ်တွင် <strong>Opus Framework</strong> ထုတ်ဝေပြီး လုံလောက်စွာ အဆင်သင့်ဖြစ်လာသည့်အခါ <strong>Android APK အပါအဝင် native application</strong> ပြုလုပ်ရန် အစီအစဉ်ရှိသည်။</p><h3>Opus Framework ဆိုတာဘာလဲ?</h3><p><strong>Opus</strong> သည် <strong>Kotlin Multiplatform</strong> အခြေခံ <em>video timeline composition</em> framework တစ်ခုဖြစ်ပြီး The Prismatic Company က ဖွံ့ဖြိုးနေသည်။ ထိုအဖွဲ့တွင် ယခင်က Alight Motion တွင် အလုပ်လုပ်ခဲ့သော developer များလည်း ပါဝင်သည်။</p><p>အကျဉ်းချုပ်ဆိုရလျှင် Opus သည် video နှင့် motion graphics application များဖန်တီးရန် အခြေခံတည်ဆောက်ပေးသည်။ Video, audio, image, text, compositing, animation, visual effects, multimedia timeline, preview, rendering, export နှင့် media လိုအပ်ချက်များကို ကိုင်တွယ်ရန် ရည်ရွယ်ထားသည်။</p><p>၎င်း၏နည်းလမ်းသည် <strong>Jetpack Compose / Compose Multiplatform</strong> နှင့် ဆင်တူပြီး editing လုပ်နေစဉ် state ပြောင်းလဲမှုများကို timeline နှင့် media elements များက real-time တုံ့ပြန်နိုင်စေသည်။</p><p>Opus သည် X, Y, Z position, camera, parallax, 3D rotation ပါဝင်သော <strong>3D space</strong> နှင့် <strong>GPU rendering၊ custom GLSL shader</strong> များအတွက် low-level API များကိုလည်း ပြသထားသည်။</p><h3>Open Motion က Opus ကို ဘာကြောင့် စိတ်ဝင်စားတာလဲ?</h3><p>Open Motion ၏ ရည်ရွယ်ချက်သည် ပုံမှန် video editor တစ်ခုသာ မဟုတ်ဘဲ <strong>motion graphics, animation, compositing နှင့် 3D</strong> editor တစ်ခုအဖြစ် ဖွံ့ဖြိုးရန် ဖြစ်သည်။</p><div class="experimentalNoticeCallout"><strong>Opus သည် Open Motion multimedia engine ၏ အခြေခံဖြစ်လာနိုင်သည်</strong>၊ timeline, video/audio decoding, playback, compositing, animation, effects, filters, GPU rendering, video export၊ 3D နှင့် camera system များကို ကိုင်တွယ်နိုင်မည်ဖြစ်သည်။</div><p>Opus သင့်တော်ပါက Open Motion သည် multimedia engine တစ်ခုလုံးကို အစမှ တည်ဆောက်ရန် မလိုတော့ဘဲ <strong>editor UI, keyframe, timeline, animation workflow, tools, effects နှင့် creative feature များ</strong>ကို ပိုမိုအာရုံစိုက်နိုင်မည်ဖြစ်သည်။</p><p>Opus သည် Kotlin Multiplatform အခြေခံဖြစ်ပြီး platform မျိုးစုံအတွက် ဒီဇိုင်းပြုလုပ်ထားသည်။ Developer material များအရ iPhone, iPad နှင့် macOS ကို ထောက်ပံ့ထားပြီး Android နှင့် Windows ကို ဖွံ့ဖြိုးနေဆဲဖြစ်သည်။ Web နှင့် backend support လည်း အစီအစဉ်ရှိသည်။</p><p>Opus ကို <strong>open source</strong> အဖြစ် ထုတ်ဝေရန်လည်း စီစဉ်ထားသော်လည်း အများပြည်သူထုတ်ဝေမည့်အချိန်မတိုင်မီ ပြင်ဆင်နေဆဲဖြစ်သည်။</p><h3>နောက်ဆုံးဆုံးဖြတ်ချက် မဟုတ်သေးပါ</h3><p><strong>Opus သည် Open Motion ၏ final engine ဖြစ်မည်ဟု မသေချာသေးပါ။</strong> Framework ကို အမှန်တကယ် ထုတ်ဝေပြီးနောက် performance, features, compatibility, license နှင့် development direction တို့ကို Open Motion လိုအပ်ချက်များနှင့် ကိုက်ညီမှုရှိမရှိ အကဲဖြတ်မည်ဖြစ်သည်။</p><p>ယခုအချိန်တွင် Open Motion ကို စမ်းသပ် project တစ်ခုအဖြစ် ဆက်လက်ဖွံ့ဖြိုးပြီး feature များတည်ဆောက်ကာ အကြံအသစ်များကို စမ်းသပ်သွားမည်ဖြစ်သည်။</p><p><strong>Open Motion ကို စမ်းသပ်အသုံးပြုပြီး အစောပိုင်းကတည်းက ဖွံ့ဖြိုးမှုကို လိုက်ကြည့်ပေးသည့်အတွက် ကျေးဇူးတင်ပါသည်။</strong></p>`
            },
            km:{
              eyebrow:`ការមើលជាមុនសម្រាប់ការសាកល្បង`,title:`Open Motion នៅតែស្ថិតក្នុងដំណាក់កាលសាកល្បង`,intro:`កំណែដែលអ្នកកំពុងប្រើនៅតែជាគំរូដំបូង។ មុខងារនៅមានកម្រិត ហើយអាចនៅមានបញ្ហាមួយចំនួន។`,accept:`ខ្ញុំយល់ហើយ`,
              body:`<h3>Open Motion នៅពេលនេះ</h3><p>ផ្នែកជាច្រើនដូចជា <strong>playback, timeline, ប្រព័ន្ធ 3D, performance និងមុខងារ editor ផ្សេងៗ</strong> នៅតែត្រូវបានអភិវឌ្ឍ និងកែលម្អបន្ត។</p><p>Open Motion នឹងអភិវឌ្ឍជាបន្តបន្ទាប់ ដោយផ្តោតលើការបង្កើត motion graphics editor ដែលបត់បែន ស្រាល និងមាន workflow ងាយស្រួលប្រើ។</p><h3>ផែនការអនាគត</h3><p>សម្រាប់ពេលនេះ Open Motion ត្រូវបានអភិវឌ្ឍជាកម្មវិធី Web ដើម្បីឲ្យការសាកល្បង មុខងារថ្មី និងការកែប្រែប្រព័ន្ធ editor ធ្វើបានរហ័សជាងមុន។</p><p>អនាគតមានផែនការបង្កើត <strong>កម្មវិធី native រួមទាំង Android APK</strong> បន្ទាប់ពី <strong>Opus Framework</strong> ត្រូវបានចេញផ្សាយ និងមានភាព成熟គ្រប់គ្រាន់សម្រាប់ប្រើប្រាស់។</p><h3>Opus Framework ជាអ្វី?</h3><p><strong>Opus</strong> គឺជា framework <em>video timeline composition</em> ដែលផ្អែកលើ <strong>Kotlin Multiplatform</strong> និងកំពុងអភិវឌ្ឍដោយ The Prismatic Company ដែលមានអ្នកអភិវឌ្ឍមួយចំនួនធ្លាប់ធ្វើការលើ Alight Motion ផងដែរ។</p><p>និយាយឲ្យសាមញ្ញ Opus ផ្តល់មូលដ្ឋានសម្រាប់បង្កើតកម្មវិធី video និង motion graphics។ វាត្រូវបានរចនាឡើងដើម្បីគ្រប់គ្រង video, audio, image, text, compositing, animation, visual effects, multimedia timeline, preview, rendering, export និងតម្រូវការ media ផ្សេងៗ។</p><p>វិធីសាស្ត្ររបស់វាស្រដៀង <strong>Jetpack Compose / Compose Multiplatform</strong> ដូច្នេះ timeline និង media elements អាចឆ្លើយតបទៅនឹងការផ្លាស់ប្តូរ state ជា real-time ខណៈពេល editing។</p><p>Opus ក៏បានបង្ហាញការគាំទ្រ <strong>3D space</strong> ដូចជា X, Y, Z position, camera, parallax, ការបង្វិល 3D និង low-level API សម្រាប់ <strong>GPU rendering និង custom GLSL shader</strong>។</p><h3>ហេតុអ្វី Open Motion ចាប់អារម្មណ៍ Opus?</h3><p>ព្រោះ Open Motion មិនមានគោលដៅត្រឹមជា video editor ធម្មតាទេ។ វាត្រូវបានគ្រោងឲ្យអភិវឌ្ឍទៅជា editor សម្រាប់ <strong>motion graphics, animation, compositing និង 3D</strong>។</p><div class="experimentalNoticeCallout"><strong>Opus អាចក្លាយជាមូលដ្ឋាន multimedia engine របស់ Open Motion</strong> សម្រាប់ timeline, video/audio decoding, playback, compositing, animation, effects, filters, GPU rendering, video export និងប្រព័ន្ធ 3D និង camera។</div><p>បើ Opus សមស្រប Open Motion មិនចាំបាច់បង្កើត multimedia engine ទាំងមូលពីសូន្យឡើយ ហើយអាចផ្តោតលើអត្តសញ្ញាណរបស់ Open Motion៖ <strong>editor UI, keyframe, timeline, animation workflow, tools, effects និងមុខងារច្នៃប្រឌិតផ្សេងៗ។</strong></p><p>Opus ផ្អែកលើ Kotlin Multiplatform និងរចនាសម្រាប់ platform ច្រើន។ តាមឯកសារអ្នកអភិវឌ្ឍ iPhone, iPad និង macOS ត្រូវបានគាំទ្ររួច ខណៈ Android និង Windows កំពុងអភិវឌ្ឍ។ Web និង backend ក៏មានក្នុងផែនការ។</p><p>Opus ក៏មានផែនការក្លាយជា <strong>open source</strong> ប៉ុន្តែនៅកំពុងរៀបចំមុនចេញផ្សាយជាសាធារណៈ។</p><h3>មិនទាន់ជាការសម្រេចចិត្តចុងក្រោយ</h3><p><strong>មិនមានការធានាថា Opus នឹងក្លាយជា engine ចុងក្រោយរបស់ Open Motion ទេ។</strong> បន្ទាប់ពី framework ត្រូវបានចេញផ្សាយពិតប្រាកដ ទើបអាចវាយតម្លៃ performance, features, compatibility, license និងទិសដៅអភិវឌ្ឍថាសមស្របនឹងតម្រូវការ Open Motion ឬអត់។</p><p>សម្រាប់ពេលនេះ Open Motion នឹងបន្តអភិវឌ្ឍជាគម្រោងសាកល្បង ខណៈពេលបង្កើតមុខងារ និងសាកល្បងគំនិតថ្មីៗ។</p><p><strong>សូមអរគុណដែលបានសាកល្បង Open Motion និងតាមដានការអភិវឌ្ឍរបស់វាតាំងពីដំណាក់កាលដំបូង។</strong></p>`
            },
            lo:{
              eyebrow:`ຕົວຢ່າງທົດລອງ`,title:`Open Motion ຍັງຢູ່ໃນຂັ້ນທົດລອງ`,intro:`ເວີຊັນທີ່ທ່ານກຳລັງໃຊ້ຍັງເປັນ prototype ໄລຍະຕົ້ນ. ຟີເຈີຍັງມີຈຳກັດ ແລະອາດຍັງມີ bug ບາງຢ່າງ.`,accept:`ເຂົ້າໃຈແລ້ວ`,
              body:`<h3>Open Motion ໃນຕອນນີ້</h3><p>ຫຼາຍສ່ວນເຊັ່ນ <strong>playback, timeline, ລະບົບ 3D, performance ແລະຟີເຈີ editor ອື່ນໆ</strong> ຍັງກຳລັງພັດທະນາ ແລະປັບປຸງ.</p><p>Open Motion ຈະພັດທະນາຕໍ່ໄປເປັນຂັ້ນໆ ໂດຍມຸ່ງສ້າງ motion graphics editor ທີ່ຍືດຫຍຸ່ນ ເບົາ ແລະມີ workflow ທີ່ໃຊ້ງານສະດວກ.</p><h3>ແຜນໃນອະນາຄົດ</h3><p>ໃນຕອນນີ້ Open Motion ພັດທະນາເປັນ Web application ເພາະຊ່ວຍໃຫ້ການທົດລອງ, ທົດສອບຟີເຈີໃໝ່ ແລະປ່ຽນລະບົບ editor ໄດ້ໄວຂຶ້ນ.</p><p>ໃນອະນາຄົດມີແຜນສ້າງ <strong>native application ລວມທັງ Android APK</strong> ຫຼັງຈາກ <strong>Opus Framework</strong> ເປີດຕົວ ແລະມີຄວາມພ້ອມພຽງພໍ.</p><h3>Opus Framework ແມ່ນຫຍັງ?</h3><p><strong>Opus</strong> ແມ່ນ framework <em>video timeline composition</em> ທີ່ອີງໃສ່ <strong>Kotlin Multiplatform</strong> ແລະກຳລັງພັດທະນາໂດຍ The Prismatic Company ຊຶ່ງມີນັກພັດທະນາທີ່ເຄີຍເຮັດວຽກກັບ Alight Motion ຮ່ວມຢູ່ດ້ວຍ.</p><p>ໂດຍງ່າຍ Opus ເປັນພື້ນຖານສຳລັບການສ້າງ video ແລະ motion graphics application ໂດຍອອກແບບໃຫ້ຈັດການ video, audio, image, text, compositing, animation, visual effects, multimedia timeline, preview, rendering, export ແລະວຽກ media ອື່ນໆ.</p><p>ວິທີການຂອງມັນຄ້າຍ <strong>Jetpack Compose / Compose Multiplatform</strong> ເຮັດໃຫ້ timeline ແລະ media elements ຕອບສະໜອງຕໍ່ການປ່ຽນ state ແບບ real-time ຂະນະ editing.</p><p>Opus ຍັງສະແດງການຮອງຮັບ <strong>3D space</strong> ເຊັ່ນ X, Y, Z position, camera, parallax, ການໝຸນ 3D ແລະ low-level API ສຳລັບ <strong>GPU rendering ແລະ custom GLSL shader</strong>.</p><h3>ເປັນຫຍັງ Open Motion ຈຶ່ງສົນໃຈ Opus?</h3><p>ເພາະເປົ້າໝາຍຂອງ Open Motion ບໍ່ແມ່ນພຽງ video editor ທົ່ວໄປ ແຕ່ຈະພັດທະນາໄປເປັນ editor ສຳລັບ <strong>motion graphics, animation, compositing ແລະ 3D</strong>.</p><div class="experimentalNoticeCallout"><strong>Opus ອາດເປັນພື້ນຖານ multimedia engine ຂອງ Open Motion</strong> ສຳລັບ timeline, video/audio decoding, playback, compositing, animation, effects, filters, GPU rendering, video export ແລະລະບົບ 3D ກັບ camera.</div><p>ຖ້າ Opus ເໝາະສົມ Open Motion ຈະບໍ່ຈຳເປັນສ້າງ multimedia engine ທັງໝົດຈາກສູນ ແລະສາມາດໂຟກັດທີ່ <strong>editor UI, keyframe, timeline, animation workflow, tools, effects ແລະ creative features ອື່ນໆ</strong> ໄດ້ຫຼາຍຂຶ້ນ.</p><p>Opus ອີງໃສ່ Kotlin Multiplatform ແລະອອກແບບສຳລັບຫຼາຍ platform. ຕາມ developer material, iPhone, iPad ແລະ macOS ຮອງຮັບແລ້ວ ສ່ວນ Android ແລະ Windows ຍັງກຳລັງພັດທະນາ. Web ແລະ backend ກໍຢູ່ໃນແຜນ.</p><p>Opus ຍັງມີແຜນຈະເປັນ <strong>open source</strong> ແຕ່ຕອນນີ້ຍັງກຳລັງກຽມພ້ອມກ່ອນອອກສູ່ສາທາລະນະ.</p><h3>ຍັງບໍ່ແມ່ນການຕັດສິນສຸດທ້າຍ</h3><p><strong>ຍັງບໍ່ແນ່ນອນວ່າ Opus ຈະເປັນ engine ສຸດທ້າຍຂອງ Open Motion.</strong> ຫຼັງຈາກ framework ຖືກປ່ອຍຈິງ ຈຶ່ງຈະປະເມີນ performance, features, compatibility, license ແລະ development direction ວ່າເໝາະກັບ Open Motion ຫຼືບໍ່.</p><p>ໃນຕອນນີ້ Open Motion ຈະສືບຕໍ່ພັດທະນາເປັນໂຄງການທົດລອງ ພ້ອມທັງສ້າງຟີເຈີ ແລະລອງແນວຄິດໃໝ່ໆ.</p><p><strong>ຂອບໃຈທີ່ລອງໃຊ້ Open Motion ແລະຕິດຕາມການພັດທະນາຕັ້ງແຕ່ໄລຍະເລີ່ມຕົ້ນ.</strong></p>`
            },
            tet:{
              eyebrow:`PREVIEW ESPERIMENTÁL`,title:`Open Motion sei iha faze esperimentál`,intro:`Versaun ne'ebé ita uza agora sei prototype inisiál. Funsaun sira seidauk barak no bug balu bele sei iha.`,accept:`Ha'u Komprende`,
              body:`<h3>Open Motion agora</h3><p>Parte balu hanesan <strong>playback, timeline, sistema 3D, performance no funsaun editor seluk</strong> sei kontinua dezenvolve no hadi'a.</p><p>Open Motion sei dezenvolve etapa ba etapa ho fokus atu harii editor motion graphics ne'ebé fleksível, kmaan no iha workflow ne'ebé komfortável.</p><h3>Planu ba oin</h3><p>Agora daudaun Open Motion dezenvolve hanesan aplikasaun web tanba fasil liu atu halo esperimentu, testa funsaun foun no muda sistema editor.</p><p>Iha futuru iha planu atu halo <strong>aplikasaun native, inklui Android APK</strong>, depois de <strong>Opus Framework</strong> sai publiku no maduru natoon atu uza.</p><h3>Saida mak Opus Framework?</h3><p><strong>Opus</strong> mak framework <em>video timeline composition</em> bazeia ba <strong>Kotlin Multiplatform</strong> ne'ebé The Prismatic Company dezenvolve hela, ho desenvolvedór sira ne'ebé uluk mos servisu iha Alight Motion.</p><p>Ho maneira simples, Opus fó fundasaun atu harii aplikasaun video no motion graphics. Nia dezenhu atu trata video, audio, imajen, testu, compositing, animation, visual effects, multimedia timeline, preview, rendering, export no nesesidade media seluk.</p><p>Nia abordagem hanesan <strong>Jetpack Compose / Compose Multiplatform</strong>, nune'e timeline no elementu media bele responde ba mudansa state iha real-time durante editing.</p><p>Opus mos hatudu suporte ba <strong>espasu 3D</strong> hanesan pozisaun X, Y, Z, kamera, parallax, rotasaun 3D no API nivel ki'ik ba <strong>GPU rendering no custom GLSL shader</strong>.</p><h3>Tanba sa Open Motion interesa ba Opus?</h3><p>Tanba objetivu Open Motion la'os deit editor video normal. Planu atu dezenvolve sai editor ba <strong>motion graphics, animation, compositing no 3D</strong>.</p><div class="experimentalNoticeCallout"><strong>Opus bele sai fundasaun multimedia engine Open Motion</strong> ba timeline, video/audio decoding, playback, compositing, animation, effects, filters, GPU rendering, video export, sistema 3D no kamera.</div><p>Se Opus duni apropriadu, Open Motion la presiza harii multimedia engine tomak husi zero. Dezenvolvimentu bele fokus liu ba identidade Open Motion: <strong>editor UI, keyframe, timeline, animation workflow, tools, effects no creative features seluk.</strong></p><p>Opus bazeia ba Kotlin Multiplatform no dezenha ba platform barak. Iha materiál desenvolvedór, iPhone, iPad no macOS suporta ona, Android no Windows sei dezenvolve hela. Web no backend mos planeadu.</p><p>Opus mos planeadu atu sai <strong>open source</strong>, maibé agora sei prepara molok sai publiku.</p><h3>Seidauk desizaun final</h3><p><strong>Seidauk garantidu katak Opus sei sai engine final Open Motion.</strong> Depois framework sai duni, foin bele avalia performance, funsaun, compatibility, lisensa no direksaun dezenvolvimentu tuir nesesidade Open Motion.</p><p>Agora Open Motion sei kontinua dezenvolve hanesan projetu esperimentál hodi harii funsaun no testa ideia foun sira.</p><p><strong>Obrigadu tanba koko Open Motion no acompanha dezenvolvimentu husi etapa inisiál.</strong></p>`
            },
            pt:{
              eyebrow:`PRÉVIA EXPERIMENTAL`,title:`O Open Motion ainda está em fase experimental`,intro:`A versão que está a utilizar ainda é um protótipo inicial. As funcionalidades ainda são limitadas e podem existir alguns erros.`,accept:`Compreendi`,
              body:`<h3>Open Motion atualmente</h3><p>Várias áreas, incluindo <strong>reprodução, timeline, sistema 3D, desempenho e outras funcionalidades do editor</strong>, continuam em desenvolvimento e aperfeiçoamento.</p><p>O Open Motion continuará a evoluir gradualmente, com foco num editor de motion graphics flexível, leve e com um fluxo de trabalho confortável.</p><h3>Planos futuros</h3><p>Por enquanto, o Open Motion é desenvolvido como uma aplicação Web porque isso torna mais rápidos os testes, a experimentação de novas funcionalidades e as alterações ao sistema do editor.</p><p>No futuro, existe o plano de criar uma <strong>aplicação nativa, incluindo APK para Android</strong>, depois de o <strong>Opus Framework</strong> ser lançado e estar suficientemente maduro para utilização.</p><h3>O que é o Opus Framework?</h3><p>O <strong>Opus</strong> é um framework de <em>video timeline composition</em> baseado em <strong>Kotlin Multiplatform</strong>, atualmente desenvolvido pela The Prismatic Company, que também envolve programadores que anteriormente trabalharam no Alight Motion.</p><p>De forma simples, o Opus fornece uma base para construir aplicações de vídeo e motion graphics. Foi concebido para lidar com vídeo, áudio, imagens, texto, compositing, animação, efeitos visuais, timelines multimédia, preview, rendering, exportação e outras necessidades de media.</p><p>A sua abordagem é semelhante ao <strong>Jetpack Compose / Compose Multiplatform</strong>, permitindo que a timeline e os elementos de media reajam em tempo real a alterações de state durante a edição.</p><p>O Opus também demonstrou suporte para <strong>espaço 3D</strong>, incluindo posições X, Y, Z, câmaras, parallax, rotação tridimensional e APIs de baixo nível para <strong>GPU rendering e shaders GLSL personalizados</strong>.</p><h3>Porque é que o Open Motion está interessado no Opus?</h3><p>Porque o objetivo do Open Motion não é ser apenas um editor de vídeo comum. Está planeado evoluir para um editor de <strong>motion graphics, animation, compositing e 3D</strong>.</p><div class="experimentalNoticeCallout"><strong>O Opus poderá tornar-se a base do motor multimédia do Open Motion</strong>, tratando timelines, descodificação de vídeo/áudio, reprodução, compositing, animação, efeitos, filtros, GPU rendering, exportação de vídeo e sistemas 3D e de câmara.</div><p>Se o Opus se revelar adequado, o Open Motion não terá de construir todo o motor multimédia do zero. O desenvolvimento poderá concentrar-se mais na identidade do Open Motion: <strong>UI do editor, keyframes, timeline, workflow de animação, ferramentas, efeitos e outras funcionalidades criativas.</strong></p><p>O Opus baseia-se em Kotlin Multiplatform e foi concebido para várias plataformas. Nos materiais dos programadores, iPhone, iPad e macOS já são suportados, enquanto Android e Windows continuam em desenvolvimento. O suporte Web e backend também está planeado.</p><p>Também está previsto que o Opus se torne <strong>open source</strong>, mas ainda está a ser preparado antes do lançamento público.</p><h3>Ainda não é uma decisão final</h3><p><strong>Não há garantia de que o Opus venha a ser o motor final do Open Motion.</strong> Depois do lançamento público do framework, será possível avaliar desempenho, funcionalidades, compatibilidade, licença e direção de desenvolvimento em relação às necessidades do Open Motion.</p><p>Por agora, o Open Motion continuará a evoluir como projeto experimental enquanto desenvolve funcionalidades e testa novas ideias.</p><p><strong>Obrigado por experimentar o Open Motion e acompanhar o seu desenvolvimento desde esta fase inicial.</strong></p>`
            },
            ta:{
              eyebrow:`சோதனை முன்னோட்டம்`,title:`Open Motion இன்னும் சோதனை நிலையில் உள்ளது`,intro:`நீங்கள் தற்போது பயன்படுத்தும் பதிப்பு இன்னும் ஆரம்பகட்ட prototype ஆகும். அம்சங்கள் குறைவாக உள்ளன; சில பிழைகளும் இருக்கலாம்.`,accept:`புரிந்தது`,
              body:`<h3>தற்போதைய Open Motion</h3><p><strong>playback, timeline, 3D அமைப்பு, performance மற்றும் editor இன் பிற அம்சங்கள்</strong> இன்னும் தொடர்ந்து உருவாக்கப்பட்டு மேம்படுத்தப்படுகின்றன.</p><p>நெகிழ்வான, இலகுவான மற்றும் வசதியான workflow கொண்ட motion graphics editor ஒன்றை உருவாக்கும் நோக்கில் Open Motion படிப்படியாக வளர்க்கப்படும்.</p><h3>எதிர்காலத் திட்டம்</h3><p>இப்போது Open Motion ஒரு Web application ஆக உருவாக்கப்படுகிறது; ஏனெனில் பரிசோதனை, புதிய அம்சங்களைச் சோதித்தல் மற்றும் editor அமைப்பை மாற்றுதல் வேகமாக செய்ய முடிகிறது.</p><p>எதிர்காலத்தில் <strong>Opus Framework</strong> வெளியிடப்பட்டு போதுமான அளவு முதிர்ந்த பிறகு <strong>Android APK உட்பட native application</strong> உருவாக்க திட்டமிடப்பட்டுள்ளது.</p><h3>Opus Framework என்றால் என்ன?</h3><p><strong>Opus</strong> என்பது <strong>Kotlin Multiplatform</strong> அடிப்படையிலான <em>video timeline composition</em> framework ஆகும். இதை The Prismatic Company உருவாக்கி வருகிறது; முன்பு Alight Motion இல் பணியாற்றிய developers சிலரும் இதில் உள்ளனர்.</p><p>எளிமையாகச் சொன்னால், video மற்றும் motion graphics applications உருவாக்குவதற்கான அடித்தளத்தை Opus வழங்குகிறது. Video, audio, images, text, compositing, animation, visual effects, multimedia timeline, preview, rendering, export மற்றும் பிற media தேவைகளை கையாளும் வகையில் இது வடிவமைக்கப்பட்டுள்ளது.</p><p>இதன் அணுகுமுறை <strong>Jetpack Compose / Compose Multiplatform</strong> போன்றது; editing நேரத்தில் state மாற்றங்களுக்கு timeline மற்றும் media elements real-time ஆக பதிலளிக்க முடியும்.</p><p>Opus <strong>3D space</strong> ஆதரவையும் காட்டியுள்ளது: X, Y, Z position, camera, parallax, 3D rotation மற்றும் <strong>GPU rendering, custom GLSL shader</strong> களுக்கான low-level API ஆகியவை இதில் அடங்கும்.</p><h3>Open Motion ஏன் Opus மீது ஆர்வமாக உள்ளது?</h3><p>Open Motion வெறும் video editor ஆக மட்டும் இருக்க வேண்டுமென்பது இலக்கு அல்ல. இது <strong>motion graphics, animation, compositing மற்றும் 3D</strong> editor ஆக வளர திட்டமிடப்பட்டுள்ளது.</p><div class="experimentalNoticeCallout"><strong>Opus, Open Motion இன் multimedia engine அடித்தளமாக அமையக்கூடும்</strong> — timeline, video/audio decoding, playback, compositing, animation, effects, filters, GPU rendering, video export, 3D மற்றும் camera systems ஆகியவற்றை கையாளுவதற்காக.</div><p>Opus பொருத்தமானதாக இருந்தால், Open Motion முழு multimedia engine ஐ ஆரம்பத்திலிருந்து உருவாக்க வேண்டியதில்லை. அதன் அடையாளத்தை உருவாக்கும் பகுதிகளில் அதிக கவனம் செலுத்தலாம்: <strong>editor UI, keyframe, timeline, animation workflow, tools, effects மற்றும் பிற creative features.</strong></p><p>Opus Kotlin Multiplatform அடிப்படையிலும் பல platform களுக்காகவும் வடிவமைக்கப்பட்டுள்ளது. Developer materials படி iPhone, iPad மற்றும் macOS ஆதரிக்கப்படுகின்றன; Android மற்றும் Windows இன்னும் உருவாக்கத்தில் உள்ளன. Web மற்றும் backend ஆதரவும் திட்டமிடப்பட்டுள்ளது.</p><p>Opus ஐ <strong>open source</strong> ஆக்கவும் திட்டமிடப்பட்டுள்ளது; ஆனால் பொதுவெளியில் வெளியிடுவதற்கு முன் இன்னும் தயாரிக்கப்பட்டு வருகிறது.</p><h3>இது இன்னும் இறுதி முடிவு அல்ல</h3><p><strong>Opus தான் Open Motion இன் இறுதி engine ஆகும் என்று இன்னும் உறுதி இல்லை.</strong> Framework உண்மையில் வெளியான பிறகு performance, features, compatibility, license மற்றும் development direction ஆகியவை Open Motion தேவைகளுக்கு பொருந்துமா என்பதை மதிப்பிட முடியும்.</p><p>இப்போதைக்கு Open Motion ஒரு experimental project ஆக தொடர்ந்து வளர்ந்து, புதிய அம்சங்களையும் யோசனைகளையும் சோதித்துக் கொண்டிருக்கும்.</p><p><strong>Open Motion ஐ முயற்சி செய்து அதன் ஆரம்ப வளர்ச்சியிலிருந்து தொடர்ந்து கவனித்து வருவதற்கு நன்றி.</strong></p>`
            }
          };
          function applyExperimentalNoticeLanguage(){
            const notice=$('#experimentalNotice');if(!notice)return;
            const lang=EXPERIMENTAL_NOTICE_I18N[homeLanguage]?homeLanguage:'en';
            if(notice.dataset.noticeLanguage===lang)return;
            const pack=EXPERIMENTAL_NOTICE_I18N[lang]||EXPERIMENTAL_NOTICE_I18N.en;
            const head=notice.querySelector('.experimentalNoticeHead');
            const body=notice.querySelector('.experimentalNoticeBody');
            const accept=notice.querySelector('#experimentalNoticeAccept');
            if(head)head.innerHTML=`<span class="experimentalNoticeEyebrow">${pack.eyebrow}</span><h2 id="experimentalNoticeTitle">${pack.title}</h2><p id="experimentalNoticeIntro">${pack.intro}</p>`;
            if(body)body.innerHTML=pack.body;
            if(accept)accept.textContent=pack.accept;
            notice.dataset.noticeLanguage=lang;
          }
          '''

          marker = 'let appLangApplying=false,appLangQueued=false;'
          if 'const EXPERIMENTAL_NOTICE_I18N=' not in text:
              if marker not in text:
                  raise SystemExit('localization marker not found')
              text = text.replace(marker, block + '\n' + marker, 1)

          old = '  translateTextTree(document.body);\n}'
          new = '  translateTextTree(document.body);\n  applyExperimentalNoticeLanguage();\n}'
          if 'applyExperimentalNoticeLanguage();' not in text:
              if old not in text:
                  raise SystemExit('applyWholeAppLanguage marker not found')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/one-shot-localize-experimental-notice.yml').unlink(missing_ok=True)

      - name: Commit localization
        run: |
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/one-shot-localize-experimental-notice.yml
          git commit -m "Localize experimental notice across all UI languages"
          git push
