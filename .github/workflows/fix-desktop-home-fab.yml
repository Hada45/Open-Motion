name: Fix desktop Home FAB alignment

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.title == 'Trigger desktop FAB alignment fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Align desktop New Project button with workspace container
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'V3.56 — align desktop Home FAB with workspace content'
          if marker not in s:
              css = r'''

/* V3.56 — align desktop Home FAB with workspace content */
@media(min-width:521px){
  .simpleHome .fabHome{
    left:max(20px,calc((100vw - 760px)/2 + 20px))!important;
    right:auto!important;
  }
}
'''
              if '</style>' not in s:
                  raise SystemExit('No </style> tag found')
              s = s.replace('</style>', css + '\n</style>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          rm -f .github/workflows/fix-desktop-home-fab.yml
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Align desktop new project button with workspace"
          git push origin main
