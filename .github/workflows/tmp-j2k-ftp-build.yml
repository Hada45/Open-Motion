name: Repack J2K FTP ARM64 APK

on:
  push:
    branches:
      - tmp-j2k-ftp-build
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  repack:
    runs-on: ubuntu-latest
    steps:
      - name: Download successful build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api /repos/Hada45/Open-Motion/actions/artifacts/10537434788/zip > all-apks.zip
          mkdir extracted
          unzip -q all-apks.zip -d extracted
          find extracted -type f -name '*.apk' -print

      - name: Prepare ARM64 APK
        run: |
          APK="$(find extracted -type f -name 'app-dev-arm64-v8a-debug.apk' | head -n1)"
          test -n "$APK"
          cp "$APK" TachiyomiJ2K-FTP-Phase2-arm64-v8a.apk
          ls -lh TachiyomiJ2K-FTP-Phase2-arm64-v8a.apk
          sha256sum TachiyomiJ2K-FTP-Phase2-arm64-v8a.apk

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: TachiyomiJ2K-FTP-Phase2-arm64
          path: TachiyomiJ2K-FTP-Phase2-arm64-v8a.apk
          if-no-files-found: error
