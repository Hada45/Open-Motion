name: Fix export audio restore

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Restore timeline audio routing after export
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_pause = "  pause(){this.sync(model.time,false)}"
          new_pause = '''  restorePlaybackAudio(){
    if(!this.audioCtx||!this.exportDest)return;
    for(const l of model.layers){
      if(!l.audioNode)continue;
      try{
        l.audioNode.disconnect();
        l.audioNode.connect(this.audioCtx.destination);
      }catch(e){}
    }
    try{this.exportDest.stream.getTracks().forEach(t=>t.stop())}catch(e){}
    this.exportDest=null;
    try{this.audioCtx.resume().catch(()=>{})}catch(e){}
  }
  pause(){
    this.sync(model.time,false);
    this.restorePlaybackAudio();
  }'''
          if old_pause not in s:
              raise SystemExit('MediaManager.pause target not found')
          s = s.replace(old_pause, new_pause, 1)

          old_fail = "        renderer.render();timeline.rebuild();\n        if(old.playing)clock.start();\n        toast('Encoder video tidak tersedia pada perangkat ini');"
          new_fail = "        media.pause();\n        renderer.render();timeline.rebuild();\n        if(old.playing)clock.start();\n        toast('Encoder video tidak tersedia pada perangkat ini');"
          if old_fail not in s:
              raise SystemExit('MediaRecorder fallback cleanup target not found')
          s = s.replace(old_fail, new_fail, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove temporary workflow and trigger, then commit
        run: |
          rm -f .github/workflows/fix-export-audio-restore.yml .export-audio-fix-trigger
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Restore timeline audio after export"
          git push origin HEAD:${{ github.head_ref }}
