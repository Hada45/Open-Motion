name: Fix export audio restore

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Restore timeline audio routing after export
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_pause = base64.b64decode('ICBwYXVzZSgpe3RoaXMuc3luYyhtb2RlbC50aW1lLGZhbHNlKX0=').decode()
          new_pause = base64.b64decode('').decode()
          if old_pause not in s:
              raise SystemExit('MediaManager.pause target not found')
          s = s.replace(old_pause, new_pause, 1)
          old_fail = base64.b64decode('ICAgICAgICByZW5kZXJlci5yZW5kZXIoKTt0aW1lbGluZS5yZWJ1aWxkKCk7CiAgICAgICAgaWYob2xkLnBsYXlpbmcpY2xvY2suc3RhcnQoKTsKICAgICAgICB0b2FzdCgnRW5jb2RlciB2aWRlbyB0aWRhayB0ZXJzZWRpYSBwYWRhIHBlcmFuZ2thdCBpbmknKTs=').decode()
          new_fail = base64.b64decode('ICAgICAgICBtZWRpYS5wYXVzZSgpOwogICAgICAgIHJlbmRlcmVyLnJlbmRlcigpO3RpbWVsaW5lLnJlYnVpbGQoKTsKICAgICAgICBpZihvbGQucGxheWluZyljbG9jay5zdGFydCgpOwogICAgICAgIHRvYXN0KCdFbmNvZGVyIHZpZGVvIHRpZGFrIHRlcnNlZGlhIHBhZGEgcGVyYW5na2F0IGluaScpOw==').decode()
          if old_fail not in s:
              raise SystemExit('MediaRecorder fallback cleanup target not found')
          s = s.replace(old_fail, new_fail, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove temporary workflow and trigger, then commit
        run: |
          rm -f .github/workflows/fix-export-audio-restore.yml .export-audio-fix-trigger
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Restore timeline audio after export"
          git push origin HEAD:${{ github.head_ref }}
