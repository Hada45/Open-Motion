name: Fix deterministic export workflow

on:
  push:
    paths:
      - '.github/workflows/fix-deterministic-workflow.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix generated JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/deterministic-export.yml')
          s=p.read_text(encoding='utf-8')
          old=".flat().map(k)=>+k.t||0)"
          new=".flat().map(k=>+k.t||0))"
          if old not in s:
              raise SystemExit('typo target not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit workflow fix
        run: |
          git config user.name "Hada"
          git config user.email "114206173+Hada45@users.noreply.github.com"
          git add .github/workflows/deterministic-export.yml
          git commit -m "Fix deterministic export workflow syntax"
          git push origin HEAD:main
