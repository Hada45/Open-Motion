name: Open Motion homepage-first migration

on:
  push:
    paths:
      - '.github/workflows/homepage-first.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Make Open Motion start on Home
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = """(async()=>{\n  await ui.loadProjectList();\n  let resumeId=null;\n  try{resumeId=sessionStorage.getItem('oms4_resume_project')}catch(e){}\n  if(resumeId)await ui.loadLocal(resumeId,{silent:true});\n})();\n"""
          new = """(async()=>{\n  // Always start at Home after opening or refreshing Open Motion.\n  // Saved projects and editing progress remain persisted; the user chooses\n  // a project from Home to continue editing.\n  try{sessionStorage.removeItem('oms4_resume_project')}catch(e){}\n  ui.showHome();\n  await ui.loadProjectList();\n})();\n"""
          if old not in s:
              raise SystemExit('startup resume block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

      - name: Verify JavaScript syntax
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          s = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'<script>(.*)</script>', s, re.S)
          if not m:
              raise SystemExit('script block not found')
          Path('/tmp/open-motion.js').write_text(m.group(1), encoding='utf-8')
          subprocess.run(['node', '--check', '/tmp/open-motion.js'], check=True)

      - name: Commit homepage-first behavior
        run: |
          git config user.name "Hada"
          git config user.email "114206173+Hada45@users.noreply.github.com"
          git add index.html
          git commit -m "Open saved projects from Home after refresh"
          git push origin main
