name: Apply Open Motion v3.90

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.openmotion-upload/v390.ready'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply Open Motion v3.90 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .openmotion-upload/v390.patch* | base64 -d | gzip -dc > /tmp/v390.patch
          echo '345887fe25345213a1eba66c9368788b7d6456d6bb51b567d6ce8dbe2b553b90  /tmp/v390.patch' | sha256sum -c -
          git apply --check /tmp/v390.patch
          git apply /tmp/v390.patch
          echo '4776ce2e4a1a89fb53f2e7db1536ce856408234a750819d8ddcd0aca80a65ccc  index.html' | sha256sum -c -
      - name: Commit Open Motion v3.90 to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm -f .openmotion-upload/v390.patch* .openmotion-upload/v390.ready .github/workflows/apply-open-motion-v390.yml
          git commit -m 'Update index.html to Open Motion v3.90'
          git push origin HEAD:${{ github.head_ref }}
