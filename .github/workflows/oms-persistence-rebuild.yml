name: Open Motion persistence rebuild

on:
  push:
    branches: [main]
    paths:
      - '.oms-persist-patch/READY'

permissions:
  contents: write

jobs:
  rebuild-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply persistence patch
        shell: bash
        run: |
          set -euo pipefail
          cat .oms-persist-patch/part* > /tmp/persistence.patch
          git apply /tmp/persistence.patch
          echo "0e5c58961c9c9cf7314ef280386ae72aa0f5297f7e3a17c4e5ed38bff500e985  index.html" | sha256sum -c -
          rm -rf .oms-persist-patch

      - name: Commit persistence fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hada"
          git config user.email "114206173+Hada45@users.noreply.github.com"
          git add -A index.html .oms-persist-patch
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Persist projects and autosave editing progress"
          git push origin HEAD:main
