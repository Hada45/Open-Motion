name: Patch mobile media persistence V3.56

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'trigger-media-persistence-v356'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch single-file Open Motion
        shell: bash
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import base64, re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          patch=base64.b64decode('').decode('utf-8')
          start='<script id="oms-media-persistence-v356">'
          end='</script><!-- /oms-media-persistence-v356 -->'
          if start in s:
              s=re.sub(r'<script id="oms-media-persistence-v356">.*?</script><!-- /oms-media-persistence-v356 -->', '', s, flags=re.S)
          block='\n'+start+'\n'+patch+'\n'+end+'\n'
          if '</body>' not in s:
              raise SystemExit('Closing body tag not found')
          s=s.replace('</body>',block+'</body>',1)
          p.write_text(s,encoding='utf-8')
          if 'V3.56 — resilient mobile media persistence' not in s:
              raise SystemExit('Patch marker missing after write')
          print('Patched index.html', p.stat().st_size)
          PYCODE
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-mobile-media-v356.yml
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/patch-mobile-media-v356.yml
          git commit -m "Make mobile media persistence resilient" || exit 0
          git push origin main
