name: Apply exact Open Motion index

on:
  push:
    branches: [main]
    paths:
      - '.oms-stage/READY'
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.title == 'Apply exact Open Motion baseline'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Assemble exact index.html
        shell: bash
        run: |
          set -euo pipefail
          cat .oms-stage/part-* | base64 -d | gzip -d > index.html.new
          actual="$(sha256sum index.html.new | awk '{print $1}')"
          expected='bb354236553ade72e263a544376b249cd4dc42167daa5ddfa662e016e408f593'
          test "$actual" = "$expected"
          mv index.html.new index.html
      - name: Commit exact baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Open Motion updater'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git rm -r .oms-stage
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Restore index.html to exact SVG play-center baseline'
          git push origin main
