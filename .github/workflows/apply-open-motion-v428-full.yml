name: Apply Open Motion v4.28 Full

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.open_motion_v428_full/READY'

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'apply-open-motion-v428-final'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch staged V4.28 payload
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin apply-open-motion-v428-final
          : > /tmp/v428.html.xz.b64
          for i in $(seq -w 0 17); do
            git show "origin/apply-open-motion-v428-final:.open_motion_v428_full/part${i}" >> /tmp/v428.html.xz.b64
          done
          base64 -d /tmp/v428.html.xz.b64 > /tmp/v428.html.xz
          xz -dc /tmp/v428.html.xz > index.html
          echo 'dea95019fa59863a71a4ccfa95e4b7cffaa3e0c2b67d355fea995337400b7677  index.html' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S|re.I)
          for i,src in enumerate(scripts):
              p=Path(f'/tmp/v428_script_{i}.js')
              p.write_text(src,encoding='utf-8')
              subprocess.run(['node','--check',str(p)],check=True)
          print(f'Checked {len(scripts)} inline scripts')
          PY

      - name: Commit Open Motion v4.28 to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf .open_motion_v428
          rm -f .github/workflows/apply-open-motion-v428.yml
          rm -f .github/workflows/apply-open-motion-v428-full.yml
          git add -A
          git commit -m 'Update index.html to Open Motion v4.28'
          git push origin HEAD:main
