name: Open Motion index rebuild

on:
  push:
    branches: [main]
    paths:
      - '.oms-upload/READY'

permissions:
  contents: write

jobs:
  rebuild-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild index.html from staged archive
        shell: bash
        run: |
          set -euo pipefail
          cat .oms-upload/part* | base64 -d > /tmp/open-motion-index.html.xz
          xz -dc /tmp/open-motion-index.html.xz > index.html
          echo "6149eba5ebbdc315c87c1800118de8dcb5e31c64c79556d3eea426885aea13a2  index.html" | sha256sum -c -
          rm -f .oms-upload/part*

      - name: Commit rebuilt index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html .oms-upload
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Open Motion index.html"
          git push origin HEAD:main
