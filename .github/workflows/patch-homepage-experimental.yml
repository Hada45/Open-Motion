name: Apply Open Motion homepage update

on:
  push:
    paths:
      - '.github/workflows/patch-homepage-experimental.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply homepage update
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          # Branding: keep the existing Open Motion logo and remove the visible STUDIO 4 subtitle.
          html = html.replace('aria-label="Open Motion Studio 4"', 'aria-label="Open Motion"', 1)
          html = html.replace('<div class="homeWordmark"><b>Open Motion</b><small>STUDIO 4</small></div>', '<div class="homeWordmark"><b>Open Motion</b></div>', 1)

          if 'id="experimentalNotice"' not in html:
              css = r'''
          .experimentalNotice{
            position:fixed;
            inset:0;
            z-index:10000;
            display:grid;
            place-items:center;
            padding:18px;
            background:rgba(12,14,21,.62);
            backdrop-filter:blur(8px);
            -webkit-backdrop-filter:blur(8px);
          }
          .experimentalNotice[aria-hidden="true"]{display:none}
          .experimentalNoticeCard{
            width:min(620px,100%);
            max-height:min(86dvh,760px);
            display:grid;
            grid-template-rows:auto minmax(0,1fr) auto;
            overflow:hidden;
            border:1px solid rgba(255,255,255,.09);
            border-radius:18px;
            background:#171a24;
            color:#eef1f6;
            box-shadow:0 24px 70px rgba(0,0,0,.42);
          }
          .experimentalNoticeHead{
            padding:18px 20px 14px;
            border-bottom:1px solid rgba(255,255,255,.08);
            background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0));
          }
          .experimentalNoticeEyebrow{
            display:inline-flex;
            align-items:center;
            gap:7px;
            margin-bottom:8px;
            color:#6fe1bd;
            font-size:9px;
            font-weight:900;
            letter-spacing:.11em;
          }
          .experimentalNoticeEyebrow:before{
            content:"";
            width:7px;
            height:7px;
            border-radius:50%;
            background:#5edbb5;
            box-shadow:0 0 0 4px rgba(94,219,181,.11);
          }
          .experimentalNoticeHead h2{
            margin:0;
            color:#fff;
            font-size:21px;
            line-height:1.2;
            letter-spacing:-.02em;
          }
          .experimentalNoticeHead p{
            margin:8px 0 0;
            color:#aeb5c3;
            font-size:11px;
            line-height:1.55;
          }
          .experimentalNoticeBody{
            padding:17px 20px 20px;
            overflow:auto;
            overscroll-behavior:contain;
            scrollbar-width:thin;
            scrollbar-color:#4c5262 transparent;
          }
          .experimentalNoticeBody::-webkit-scrollbar{width:6px}
          .experimentalNoticeBody::-webkit-scrollbar-thumb{background:#4c5262;border-radius:999px}
          .experimentalNoticeBody h3{
            margin:18px 0 7px;
            color:#f5f7fb;
            font-size:12px;
            line-height:1.3;
          }
          .experimentalNoticeBody h3:first-child{margin-top:0}
          .experimentalNoticeBody p{
            margin:0 0 10px;
            color:#c1c7d2;
            font-size:11px;
            line-height:1.68;
          }
          .experimentalNoticeBody strong{color:#f3f6fa;font-weight:800}
          .experimentalNoticeCallout{
            margin:13px 0;
            padding:12px 13px;
            border:1px solid rgba(94,219,181,.18);
            border-radius:12px;
            background:rgba(94,219,181,.065);
            color:#dce8e4;
            font-size:10.5px;
            line-height:1.6;
          }
          .experimentalNoticeFooter{
            padding:13px 20px calc(13px + env(safe-area-inset-bottom));
            border-top:1px solid rgba(255,255,255,.08);
            background:#171a24;
          }
          .experimentalNoticeAccept{
            width:100%;
            height:42px;
            border:0;
            border-radius:11px;
            background:#5edbb5;
            color:#10201b;
            font-weight:900;
            font-size:11px;
            letter-spacing:.02em;
            box-shadow:0 8px 24px rgba(94,219,181,.15);
          }
          .experimentalNoticeAccept:active{transform:translateY(1px);filter:brightness(.96)}
          .experimentalNoticeAccept:focus-visible{outline:2px solid #b5f4df;outline-offset:3px}
          @media(max-width:560px){
            .experimentalNotice{padding:12px;place-items:center}
            .experimentalNoticeCard{max-height:88dvh;border-radius:16px}
            .experimentalNoticeHead{padding:16px 16px 12px}
            .experimentalNoticeHead h2{font-size:19px}
            .experimentalNoticeBody{padding:15px 16px 18px}
            .experimentalNoticeBody h3{margin-top:16px}
            .experimentalNoticeFooter{padding-left:16px;padding-right:16px}
          }
          '''

              markup = r'''
            <div id="experimentalNotice" class="experimentalNotice" role="dialog" aria-modal="true" aria-labelledby="experimentalNoticeTitle" aria-describedby="experimentalNoticeIntro">
              <section class="experimentalNoticeCard">
                <header class="experimentalNoticeHead">
                  <span class="experimentalNoticeEyebrow">EXPERIMENTAL PREVIEW</span>
                  <h2 id="experimentalNoticeTitle">Open Motion masih dalam tahap eksperimen</h2>
                  <p id="experimentalNoticeIntro">Versi yang kamu gunakan sekarang masih merupakan prototipe awal. Fiturnya memang belum banyak dan kemungkinan masih ada beberapa bug.</p>
                </header>

                <div class="experimentalNoticeBody">
                  <h3>Open Motion saat ini</h3>
                  <p>Beberapa bagian seperti <strong>playback, timeline, sistem 3D, performa, dan fitur editor lainnya</strong> masih terus dikembangkan dan disempurnakan.</p>
                  <p>Open Motion akan berkembang secara bertahap dengan fokus membangun editor motion graphics yang fleksibel, ringan, dan punya workflow yang nyaman digunakan.</p>

                  <h3>Rencana ke depan</h3>
                  <p>Untuk sekarang, Open Motion dikembangkan sebagai aplikasi berbasis web karena lebih cepat untuk melakukan eksperimen, mencoba fitur baru, dan mengubah sistem editor.</p>
                  <p>Ke depannya, ada rencana untuk membuat <strong>versi aplikasi native, termasuk APK Android</strong>, setelah <strong>Opus Framework</strong> dirilis dan kondisinya sudah cukup matang untuk digunakan.</p>

                  <h3>Apa itu Opus Framework?</h3>
                  <p><strong>Opus</strong> adalah framework <em>video timeline composition</em> berbasis <strong>Kotlin Multiplatform</strong> yang sedang dikembangkan oleh The Prismatic Company, yang juga melibatkan pengembang yang sebelumnya pernah mengerjakan Alight Motion.</p>
                  <p>Secara sederhana, Opus menyediakan fondasi untuk membuat aplikasi yang berhubungan dengan video dan motion graphics. Framework ini dirancang untuk menangani video, audio, gambar, teks, compositing, animasi, efek visual, timeline multimedia, preview, rendering, export, serta berbagai kebutuhan media lainnya.</p>
                  <p>Cara kerjanya memakai pendekatan yang mirip dengan <strong>Jetpack Compose / Compose Multiplatform</strong>, sehingga timeline dan elemen media dapat bereaksi terhadap perubahan state secara real-time saat pengguna melakukan editing.</p>
                  <p>Opus juga sudah memperlihatkan dukungan untuk <strong>ruang 3D</strong> seperti posisi X, Y, Z, kamera, parallax, dan rotasi tiga dimensi, serta API tingkat rendah untuk <strong>GPU rendering dan custom shader GLSL</strong>.</p>

                  <h3>Kenapa Open Motion tertarik memakai Opus?</h3>
                  <p>Karena tujuan Open Motion bukan hanya menjadi editor video biasa. Open Motion direncanakan berkembang menjadi editor <strong>motion graphics, animation, compositing, dan 3D</strong>.</p>
                  <div class="experimentalNoticeCallout"><strong>Opus bisa menjadi fondasi mesin multimedia Open Motion</strong> untuk menangani timeline, decoding video/audio, playback, compositing, animasi, efek, filter, GPU rendering, export video, serta sistem 3D dan kamera.</div>
                  <p>Kalau Opus nantinya memang cocok, Open Motion tidak perlu membangun seluruh engine multimedia dari nol. Pengembangan bisa lebih fokus pada bagian yang benar-benar membentuk identitas Open Motion: <strong>UI editor, keyframe, timeline, workflow animasi, tools, efek, dan fitur kreatif lainnya.</strong></p>
                  <p>Opus berbasis Kotlin Multiplatform dan dirancang untuk digunakan di beberapa platform. Pada materi pengembangnya, iPhone, iPad, dan macOS sudah didukung, sementara Android dan Windows masih dalam pengembangan. Dukungan Web dan backend juga direncanakan.</p>
                  <p>Opus juga direncanakan menjadi <strong>open source</strong>, tetapi saat ini masih dipersiapkan sebelum dirilis secara publik.</p>

                  <h3>Belum keputusan final</h3>
                  <p><strong>Opus belum tentu menjadi engine final Open Motion.</strong> Setelah framework-nya benar-benar dirilis, baru bisa dilihat apakah performa, fitur, kompatibilitas, lisensi, dan arah pengembangannya cocok dengan kebutuhan Open Motion.</p>
                  <p>Untuk sekarang, Open Motion akan tetap berkembang sebagai proyek eksperimen sambil terus membangun fitur dan mencoba berbagai ide.</p>
                  <p><strong>Terima kasih sudah mencoba Open Motion dan ikut melihat perkembangannya dari tahap awal.</strong></p>
                </div>

                <footer class="experimentalNoticeFooter">
                  <button id="experimentalNoticeAccept" class="experimentalNoticeAccept" type="button">Saya Mengerti</button>
                </footer>
              </section>
            </div>
          '''

              script = r'''
          <script>
          (() => {
            const notice = document.getElementById('experimentalNotice');
            const accept = document.getElementById('experimentalNoticeAccept');
            if (!notice || !accept) return;

            const closeNotice = () => notice.setAttribute('aria-hidden', 'true');
            accept.addEventListener('click', closeNotice);
            notice.addEventListener('click', (event) => {
              if (event.target === notice) closeNotice();
            });
            document.addEventListener('keydown', (event) => {
              if (event.key === 'Escape' && notice.getAttribute('aria-hidden') !== 'true') closeNotice();
            });
            requestAnimationFrame(() => accept.focus({ preventScroll: true }));
          })();
          </script>
          '''

              style_anchor = '</style>'
              editor_anchor = '  <section id="editor" class="editor hidden">'
              body_anchor = '</body>'

              if style_anchor not in html:
                  raise SystemExit('Could not find </style> anchor')
              if editor_anchor not in html:
                  raise SystemExit('Could not find editor anchor')
              if body_anchor not in html:
                  raise SystemExit('Could not find </body> anchor')

              html = html.replace(style_anchor, css + '\n' + style_anchor, 1)
              html = html.replace(editor_anchor, markup + '\n\n' + editor_anchor, 1)
              html = html.replace(body_anchor, script + '\n\n' + body_anchor, 1)

          # Safety checks before writing.
          required = [
              'id="experimentalNotice"',
              'id="experimentalNoticeAccept"',
              'The Prismatic Company',
              'yang juga melibatkan pengembang yang sebelumnya pernah mengerjakan Alight Motion',
              '<div class="homeWordmark"><b>Open Motion</b></div>',
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit(f'Missing expected content after patch: {missing}')

          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit update and remove temporary workflow
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-homepage-experimental.yml
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update homepage experimental notice and branding"
          git push origin HEAD:main
